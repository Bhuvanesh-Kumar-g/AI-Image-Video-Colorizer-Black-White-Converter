<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image & Video Colorizer / B&W Converter</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Poppins:wght@300;400;600&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" />
</head>
<body class="tool-page">

    <!-- Simple Nav -->
    <nav style="padding: 20px;">
        <a href="/" class="btn-small">
            <span class="material-symbols-outlined" style="font-size: 18px;">home</span> Home
        </a>
    </nav>

    <!-- Main Container -->
    <div class="glass-container">
        <h1>AI Image & Video Colorizer / B&W Converter</h1>
        <p>Upload a Black & White image or video to restore its color using Deep Learning.</p>

        <!-- Upload Area -->
        <div class="upload-wrapper">
            <div class="upload-area" id="uploadArea">
                <input type="file" id="fileInput" accept="image/*,video/*" style="display: none;">
                <div class="upload-icon">
                    <span class="material-symbols-outlined" style="font-size: 56px;">cloud_upload</span>
                </div>
                <p>Drag & drop file here, or <span class="browse-link" id="browseButton">browse</span></p>
                <p class="file-name" id="fileName"></p>
            </div>
        </div>

        <!-- Buttons -->
        <div class="controls">
            <button id="colorizeBtn" class="btn" disabled>
                <span class="material-symbols-outlined">palette</span> Colorize
            </button>
            <button id="bwBtn" class="btn btn-secondary" disabled>
                <span class="material-symbols-outlined">filter_b_and_w</span> Convert to B&W
            </button>
        </div>

        <!-- Terminal Log Output -->
        <div id="logContainer" class="log-terminal" style="display:none;">
            <span class="material-symbols-outlined blink">terminal</span>
            <span id="logText">Waiting to start...</span>
        </div>

        <!-- Progress Bar -->
        <div class="progress-bar-container" id="progressBarContainer" style="display: none;">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <!-- Results -->
        <div id="outputArea" class="output-box"></div>
    </div>

    <footer>
        <p>&copy; 2025 AI Colorizer Project.</p>
    </footer>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
